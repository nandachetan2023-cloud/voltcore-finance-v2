<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" style="enable-background:new 0 0 30 30;" xml:space="preserve">
<defs>
  <style type="text/css">
    .st-bg { fill:#161c24; stroke:#f5a623; stroke-width:1.5; stroke-miterlimit:10; }
    .st-core { fill:#f5a623; }
    .core-glow {
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(0.95); transform-origin: 15px 15px; }
      50% { opacity: 1; transform: scale(1.05); transform-origin: 15px 15px; }
    }
  </style>
</defs>
<g>
  <!-- Beautiful Hexagonal Border representing VoltCore -->
  <polygon class="st-bg" points="15,2 27,9 27,21 15,28 3,21 3,9" />
  <!-- Glowing Circular Core -->
  <circle class="st-core core-glow" cx="15" cy="15" r="5" />
</g>
</svg>
